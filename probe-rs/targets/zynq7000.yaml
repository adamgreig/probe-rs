---
name: Zynq 7000 Series
manufacturer:
  id: 0xC9
  cc: 0x0
variants:
- name: X7Z
  cores:
    - name: core0
      type: armv7a
      core_access_options: !Arm
        ap: !v1 1
        debug_base: 0x80090000  # This address used from APB-AP debug bus.
        cti_base: 0x80098000
        jtag_tap: 1
    - name: core1
      type: armv7a
      core_access_options: !Arm
        ap: !v1 1
        debug_base: 0x80092000  # This address used from APB-AP debug bus.
        cti_base: 0x80099000
        jtag_tap: 1
  jtag:
    scan_chain:
      - name: PL
        ir_len: 6
      - name: PS
        ir_len: 4
  rtt_scan_ranges:
    - start: 0x00000000
      end: 0x00040000
  memory_map:
    - !Ram
      name: OCM
      range:
        start: 0x00000000
        end: 0x00040000
      cores:
        - core0
        - core1
      access:
        boot: true
    - !Ram
      name: DDR
      range:
        start: 0x00100000
        end: 0x3fffffff
      cores:
        - core0
        - core1
    - !Nvm
      name: QSPI
      range:
        start: 0xfc000000
        end: 0xfcffffff
      cores:
        - core0
        - core1
  flash_algorithms:
    - zynq7000-qspi-flash-algorithm
flash_algorithms:
- name: zynq7000-qspi-flash-algorithm
  description: A flash algorithm under test
  default: true
  instructions: 
  load_address: 0x20
  pc_init: 0x0
  pc_uninit: 0x80
  pc_program_page: 0xb4
  pc_erase_sector: 0xa0
  pc_erase_all: 0xc8
  pc_verify: 0x120
  pc_blank_check: 0x140
  pc_read: 0xb4
  data_section_offset: 0x168
  flash_properties:
    address_range:
      start: 0xfc000000
      end: 0xfd000000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - core0
